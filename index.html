<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escale - Voyage</title>
    <!-- Styles Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f8f9fa; color: #333; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; position: relative; }
        header { background: #007AFF; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; flex-shrink: 0; }
        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 90px; display: none; }
        .content.active { display: block; }
        nav { display: flex; background: white; border-top: 1px solid #ddd; position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; z-index: 9999; padding-bottom: env(safe-area-inset-bottom); }
        nav button { flex: 1; background: none; border: none; font-size: 0.9rem; color: #8e8e93; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
        nav button.active { color: #007AFF; font-weight: bold; }
        #map { width: 100%; height: 100%; border-radius: 10px; min-height: 300px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        input, button.btn { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        button.btn { background: #007AFF; color: white; border: none; font-weight: bold; cursor: pointer; }
        .chat-box { height: 250px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .chat-msg { background: #e1f5fe; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header id="header-title">Escale - Frais</header>

    <!-- Onglet Frais -->
    <div id="tab-frais" class="content active">
        <div class="card">
            <h2>Gestion des Dépenses</h2>
            <input type="text" id="expense-name" placeholder="Nom de la dépense (ex: Restaurant)">
            <input type="number" id="expense-amount" placeholder="Montant en €">
            <button class="btn" onclick="addExpense()">Ajouter la dépense</button>
        </div>
        <div class="card">
            <h3>Soldes actuels</h3>
            <p id="balance-display">Aucune dépense pour l'instant.</p>
        </div>
    </div>

    <!-- Onglet Carte & GPS -->
    <div id="tab-carte" class="content">
        <div id="map"></div>
    </div>

    <!-- Onglet Rencontres & Chat -->
    <div id="tab-rencontres" class="content">
        <div class="card">
            <h2>Discussion Voyageurs</h2>
            <div id="chat-messages" class="chat-box">
                <div class="chat-msg"><b>Bienvenue !</b> Discutez avec les autres membres du voyage ici.</div>
            </div>
            <input type="text" id="chat-input" placeholder="Écrire un message...">
            <button class="btn" onclick="sendChatMessage()">Envoyer</button>
        </div>
    </div>

    <!-- Barre de navigation -->
    <nav>
        <button class="active" onclick="switchTab('frais', this)">💶 Frais</button>
        <button onclick="switchTab('carte', this)">🗺️ Carte</button>
        <button onclick="switchTab('rencontres', this)">💬 Rencontres</button>
    </nav>

    <!-- Script Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        function switchTab(tabName, btn) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            btn.classList.add('active');

            const titles = { frais: 'Escale - Frais', carte: 'Escale - Carte', rencontres: 'Escale - Rencontres' };
            document.getElementById('header-title').innerText = titles[tabName];

            if (tabName === 'carte' && !map) {
                setTimeout(() => {
                    map = L.map('map').setView([48.8566, 2.3522], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    }).addTo(map);

                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(position => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            map.setView([lat, lng], 14);
                            L.marker([lat, lng]).addTo(map).bindPopup("Vous êtes ici !").openPopup();
                        });
                    }
                    map.invalidateSize();
                }, 200);
            } else if (tabName === 'carte' && map) {
                setTimeout(() => map.invalidateSize(), 200);
            }
        }

        function addExpense() {
            const name = document.getElementById('expense-name').value;
            const amount = document.getElementById('expense-amount').value;
            if(name && amount) {
                document.getElementById('balance-display').innerText = `Dernière dépense : ${name} (${amount}€)`;
                document.getElementById('expense-name').value = '';
                document.getElementById('expense-amount').value = '';
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(text) {
                const box = document.getElementById('chat-messages');
                box.innerHTML += `<div class="chat-msg"><b>Moi :</b> ${text}</div>`;
                input.value = '';
                box.scrollTop = box.scrollHeight;
            }
        }
    </script>
</body>
</html>
